[project]
name = "tactical-ilp"
version = "0.1.0"
description = "Symbolic tactical pattern discovery for football build-up play (StatsBomb 360 + Popper ILP; no neural model)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "statsbombpy>=1.14",
    "socceraction>=1.5",
    "kloppy>=3.15",
    "pandas>=2.0",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "mplsoccer>=1.4",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    # pandera 0.17 (pulled in by socceraction) is incompatible with multimethod>=2
    "multimethod<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests that need internet access to StatsBomb Open Data",
    "slow: slow tests",
]
